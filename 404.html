<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Shrish Group</title>
    <meta
      name="description"
      content="The page you were looking for is not on the Shrish Group hub. Head back to the homepage or reach our Chennai desk."
    />
    <meta name="robots" content="noindex, follow" />

    <link
      rel="icon"
      href="assets/images/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/css/index.css" />

  <body>
    <main class="error-page">
      <div class="container text-center">
        <span class="eyebrow">Error 404</span>
        <h1 style="font-size: clamp(3rem, 10vw, 6rem); margin: 8px 0">404</h1>
        <h2 class="section-title">This page isn't part of the ecosystem</h2>
        <div class="title-underline"></div>
        <p class="section-subtitle">
          The link may be outdated, or the page has moved. Everything else is
          one click away.
        </p>
        <div class="error-actions">
          <a href="/index.html" class="btn-accent"
            ><i class="fa-solid fa-house"></i> Back to home</a
          >
          <a href="/divisions.html" class="btn-outline">See our divisions</a>
          <a href="/contact.html" class="btn-outline">Contact the desk</a>
        </div>
      </div>
