[build]
  publish = "."
  functions = "netlify/functions"

# Serve the static hub homepage at the root path.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Pretty URLs -> the underlying .html files.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/divisions"
  to = "/divisions.html"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 301

[[redirects]]
  from = "/newsroom"
  to = "/newsroom.html"
  status = 301

[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

# Private employee portal lives on its own subdomain.
[[redirects]]
  from = "/portal"
  to = "https://admin.shrishgroup.com"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_components/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
