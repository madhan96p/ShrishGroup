<!-- SHRISH GROUP - COOKIE BANNER (injected by assets/js/components.js) -->
<div
  class="cookie-banner glass-card"
  id="cookieBanner"
  role="dialog"
  aria-label="Cookie notice"
>
  <p>
    We use minimal cookies to understand how visitors move between Shrish Group
    and our divisions, so we can keep the experience fast and relevant. No
    advertising trackers.
  </p>
  <div class="cookie-actions">
    <button class="btn-outline" id="cookieDecline" type="button">
      Decline
    </button>
    <button class="btn-accent" id="cookieAccept" type="button">Accept</button>
  </div>
</div>
